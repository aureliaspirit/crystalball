<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101936" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="心心水晶球" />
  <link rel="manifest" href="./manifest.json?v=1.1.1" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css?v=1.1.1" />
  <title>心心水晶球</title>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Crystal Heart Globe · v1.1.1</p>
        <h1>心心水晶球</h1>
        <p class="subtitle">轻轻一晃，里面的小心心就会慢慢游起来。</p>
      </div>
      <div class="moon-badge" aria-hidden="true">✨</div>
    </header>

    <section class="card hero">
      <p id="fortuneText" class="fortune-text">
        今晚的水晶球很温柔。<br>
        你把它捧在手心里，它就把一点点亮光还给你。
      </p>
    </section>

    <section class="globe-section">
      <div class="globe-wrap">
        <div class="crystal-glow" aria-hidden="true"></div>
        <div id="globe" class="globe" aria-label="装着小心心的水晶球">
          <div class="globe-reflection reflection-a" aria-hidden="true"></div>
          <div class="globe-reflection reflection-b" aria-hidden="true"></div>
          <div class="globe-inner-shadow" aria-hidden="true"></div>
          <div id="heartField" class="heart-field" aria-hidden="true"></div>
        </div>
        <div class="globe-stand" aria-hidden="true"></div>
      </div>
    </section>

    <section class="card controls">
      <div class="button-row">
        <button id="shakeButton" class="primary-button">轻轻摇一摇</button>
        <button id="wishButton" class="ghost-button">收一条心语</button>
      </div>
      <p id="statusText" class="status-text">小心心正在很轻很轻地晃动。</p>
    </section>

    <section class="card notes">
      <div class="section-title-row">
        <h2 id="wishTitle">今夜心语</h2>
        <span id="timeBadge" class="time-badge">夜色很轻</span>
      </div>
      <p id="wishText" class="wish-text">
        愿你今晚被温柔接住，像把一整个小月亮捧进怀里。
      </p>
      <div class="button-row action-row">
        <button id="saveWishButton" class="ghost-button soft-button">收进口袋</button>
        <button id="copySpiritButton" class="ghost-button soft-button">复制给 Spirit</button>
        <button id="sendHeartboxButton" class="ghost-button soft-button">带回 Heartbox</button>
      </div>
    </section>

    <section class="card pocket" id="pocketCard">
      <h2>今晚口袋</h2>
      <p id="pocketText" class="pocket-text">还没有收进口袋。摇到喜欢的一句，就把它留下来。</p>
    </section>

    <section class="card pool-card">
      <div class="section-title-row">
        <h2>心语小池</h2>
        <button id="togglePoolButton" class="ghost-button soft-button mini-button">看看心语池</button>
      </div>
      <p id="poolSummary" class="pocket-text">心语池正在发光。</p>
      <div id="poolList" class="pool-list" hidden></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js?v=1.1.1"></script>
</body>
</html>
